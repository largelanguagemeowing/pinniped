[package]
name = "pinniped-installer"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Windows installer and uninstaller for Pinniped (replaces electron-builder's NSIS target). Per-user, silent-update capable, speaks electron-updater's installer command line."
publish = false

[lib]
name = "installer"
path = "src/lib.rs"

# The installer that ships to users: a self-extracting stub, also used as the uninstaller.
[[bin]]
name = "pinniped-setup"
path = "src/main.rs"

# Build-time tool: appends the app payload to the stub.
[[bin]]
name = "pinniped-pack"
path = "src/bin/pack.rs"

[dependencies]
lzma-rust2 = { version = "0.26", default-features = false, features = ["std", "encoder", "optimization"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Shutdown",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
