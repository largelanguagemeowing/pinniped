[package]
name = "pinniped-helper"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Desktop-portal helper for Pinniped: global shortcuts and autostart over D-Bus."
publish = false

[dependencies]
ashpd = { version = "0.14", features = ["global_shortcuts", "background"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util"] }
zbus = "6"
