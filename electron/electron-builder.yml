appId: club.stablecat.pinniped
productName: Pinniped
copyright: Pinniped contributors (AGPL-3.0-only)

directories:
  output: electron/out
  buildResources: electron/build

# main process uses only node built-ins + electron, so ship dist + electron/
# and explicitly drop node_modules to keep the package lean
files:
  - dist/**/*
  # Every main-process module; a file left out only fails when the installed app starts.
  - electron/*.cjs
  - electron/build/icon.png
  # electron-updater, bundled by the beforePack hook (Windows self-update)
  - electron/updater.bundle.cjs
  - package.json
  - '!node_modules/**/*'

extraMetadata:
  main: electron/main.cjs

beforePack: scripts/fork/electron/before-pack.cjs

# Windows self-update reads latest.yml from the GitHub release of the matching tag.
publish:
  provider: github
  owner: largelanguagemeowing
  repo: pinniped

# one archive instead of ~thousands of loose files (faster install and start).
# Electron reads asar transparently in the main process, which is all that
# touches these files (the app:// handler serves dist, nothing spawns them).
# The window/tray icon is the one file handed to the OS as a real path.
asar: true
asarUnpack:
  - electron/build/icon.png

# app ships no node_modules (main uses only node built-ins), skip native rebuild
npmRebuild: false

linux:
  # Desktop helper (global shortcuts, autostart, screen share audio); built by
  # `cargo build --release` in electron/helper.
  extraResources:
    - from: electron/helper/target/release/pinniped-helper
      to: pinniped-helper
  # ties the running window (WM_CLASS / app id) to club.stablecat.pinniped.desktop so
  # taskbars show this icon instead of a generic one
  syncDesktopName: true
  target:
    - AppImage
    - rpm
    - flatpak

rpm:
  artifactName: ${productName}-${version}-${arch}.${ext}
  # fpm defaults to single-threaded gzip -9 (w9.gzdio): ~65 s for the ~350 MB
  # payload. Multithreaded xz gets the same size class in a fraction of the time.
  fpm:
    - --rpm-compression
    - xzmt
    - --rpm-compression-level
    - '6'
  category: Network
  icon: electron/build/icon.png
  synopsis: Yet another Matrix client
  description: Desktop build of the Pinniped Matrix client.
  maintainer: largelanguagemeowing <noreply@mreow.de>

mac:
  target:
    - dmg
  category: public.app-category.social-networking
  icon: electron/build/icon.png
  # unsigned local build; macOS kills apps that request camera/mic access
  # without these usage strings
  identity: null
  extendInfo:
    NSCameraUsageDescription: Pinniped needs camera access for video calls.
    NSMicrophoneUsageDescription: Pinniped needs microphone access for calls.

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target:
    - nsis
  # Desktop helper (per-application screen share audio); built by
  # `cargo build --release` in electron/helper.
  extraResources:
    - from: electron/helper/target/release/pinniped-helper.exe
      to: pinniped-helper.exe
  icon: electron/build/icon.png

# One-click, per-user install (no UAC, installs in seconds, like Discord), which is what lets
# updates apply silently. electron-updater cannot update MSI packages.
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

flatpak:
  # electron-builder defaults to the EOL 20.08 runtime; Flathub rejects EOL ones
  runtimeVersion: '25.08'
  baseVersion: '25.08'
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Electron needs these inside the sandbox; calls need camera + audio.
  finishArgs:
    - --share=ipc
    - --share=network
    - --socket=fallback-x11
    - --socket=wayland
    - --socket=pulseaudio
    # Native PipeWire, for the helper's screen share audio device (pulseaudio is only the Pulse socket).
    - --filesystem=xdg-run/pipewire-0
    - --device=all
    - --talk-name=org.freedesktop.Notifications
