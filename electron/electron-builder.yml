appId: club.stablecat.pinniped
productName: Pinniped
copyright: Pinniped contributors (AGPL-3.0-only)

directories:
  output: electron/out
  buildResources: electron/build

# main process uses only node built-ins + electron, so ship dist + electron/
# and explicitly drop node_modules to keep the package lean
files:
  - dist/**/*
  - electron/main.cjs
  - electron/preload.cjs
  - electron/app-protocol.cjs
  - electron/menu.cjs
  - electron/rich-presence.cjs
  - electron/screenshare-audio.cjs
  - electron/build/icon.png
  - package.json
  - '!node_modules/**/*'

extraMetadata:
  main: electron/main.cjs

# one archive instead of ~thousands of loose files (faster install and start).
# Electron reads asar transparently in the main process, which is all that
# touches these files (the app:// handler serves dist, nothing spawns them).
# The window/tray icon is the one file handed to the OS as a real path.
asar: true
asarUnpack:
  - electron/build/icon.png

# app ships no node_modules (main uses only node built-ins), skip native rebuild
npmRebuild: false

linux:
  # Portal helper (global shortcuts, autostart); built by `cargo build --release` in electron/helper.
  extraResources:
    - from: electron/helper/target/release/pinniped-helper
      to: pinniped-helper
  # ties the running window (WM_CLASS / app id) to club.stablecat.pinniped.desktop so
  # taskbars show this icon instead of a generic one
  syncDesktopName: true
  target:
    - AppImage
    - rpm
    - flatpak

rpm:
  artifactName: ${productName}-${version}-${arch}.${ext}
  # fpm defaults to single-threaded gzip -9 (w9.gzdio): ~65 s for the ~350 MB
  # payload. Multithreaded xz gets the same size class in a fraction of the time.
  fpm:
    - --rpm-compression
    - xzmt
    - --rpm-compression-level
    - '6'
  category: Network
  icon: electron/build/icon.png
  synopsis: Yet another Matrix client
  description: Desktop build of the Pinniped Matrix client.
  maintainer: largelanguagemeowing <noreply@mreow.de>

mac:
  target:
    - dmg
  category: public.app-category.social-networking
  icon: electron/build/icon.png
  # unsigned local build; macOS kills apps that request camera/mic access
  # without these usage strings
  identity: null
  extendInfo:
    NSCameraUsageDescription: Pinniped needs camera access for video calls.
    NSMicrophoneUsageDescription: Pinniped needs microphone access for calls.

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target:
    - msi
  icon: electron/build/icon.png

msi:
  oneClick: true
  perMachine: false
  artifactName: ${productName}-${version}-${arch}.${ext}

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

flatpak:
  # electron-builder defaults to the EOL 20.08 runtime; Flathub rejects EOL ones
  runtimeVersion: '25.08'
  baseVersion: '25.08'
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Electron needs these inside the sandbox; calls need camera + audio.
  finishArgs:
    - --share=ipc
    - --share=network
    - --socket=fallback-x11
    - --socket=wayland
    - --socket=pulseaudio
    - --device=all
    - --talk-name=org.freedesktop.Notifications
