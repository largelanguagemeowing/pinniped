# Fork-only: build the Electron desktop app (AppImage, rpm, flatpak, NSIS exe, dmg) on CI.
# Every push to fork/dev, every tag and every manual run builds the web bundle and
# all three installer packages (Linux in a Fedora container). Installers are uploaded as
# workflow artifacts, and a `v*` tag also attaches them to a GitHub release.
name: desktop
on:
  push:
    branches: [fork/dev]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Build
        env:
          APP_COMMIT: ${{ github.sha }}
          NODE_OPTIONS: --max_old_space_size=8192
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  package:
    name: Package (${{ matrix.name }})
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            flags: --win nsis
            # latest.yml + .blockmap are what the installed app's updater reads (electron-updater)
            files: |
              electron/out/*.exe
              electron/out/*.exe.blockmap
              electron/out/latest.yml
          - name: macos
            os: macos-latest
            flags: --mac dmg --x64 --arm64
            files: electron/out/*.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        env:
          HUSKY: '0'
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.name == 'windows'
      # Per-application screen share audio (electron-builder extraResources).
      - name: Build the desktop helper
        if: matrix.name == 'windows'
        run: cargo build --release --manifest-path electron/helper/Cargo.toml
      - name: Package
        run: npx electron-builder --config electron/electron-builder.yml ${{ matrix.flags }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: pinniped-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  package-linux:
    name: Package (linux)
    needs: web
    runs-on: ubuntu-latest
    # Fedora, so build tools come from dnf instead of Ubuntu's often slow apt mirrors;
    # privileged because flatpak-builder sandboxes its build with bubblewrap.
    container:
      image: registry.fedoraproject.org/fedora:45
      options: --privileged
    steps:
      # git before checkout, which otherwise downloads a tarball without history.
      # The helper links libpipewire; bindgen needs libclang to read its headers.
      - name: Install build tools
        run: |
          dnf install -y git-core rpm flatpak flatpak-builder pipewire-devel clang-devel gcc golang
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        env:
          HUSKY: '0'
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: dtolnay/rust-toolchain@stable
      # Portals and screen share audio; shipped by electron-builder (extraResources) and nfpm.
      - name: Build the desktop helper
        run: cargo build --release --manifest-path electron/helper/Cargo.toml
      # The RPM is packaged with nfpm below, not electron-builder (see electron/linux/nfpm.yaml).
      - name: Package
        run: npx electron-builder --config electron/electron-builder.yml --linux AppImage flatpak --publish never
      # Pinned to the version the justfile recipe was tested with.
      - name: Build the RPM with nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          export VERSION="$(node -p "require('./package.json').version")"
          chmod -R go-w electron/out/linux-unpacked
          nfpm package --packager rpm --config electron/linux/nfpm.yaml --target "electron/out/Pinniped-${VERSION}-x86_64.rpm"
          rpm -qpi "electron/out/Pinniped-${VERSION}-x86_64.rpm"
      - uses: actions/upload-artifact@v4
        with:
          name: pinniped-linux
          path: |
            electron/out/*.AppImage
            electron/out/*.rpm
            electron/out/*.flatpak
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, package-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pinniped-*
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes
