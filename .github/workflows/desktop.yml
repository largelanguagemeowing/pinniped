# Fork-only: build the Electron desktop app (AppImage, rpm, flatpak, msi, dmg) on CI.
# Every push to fork/dev, every tag and every manual run builds the web bundle and
# all three installer packages. Installers are uploaded as workflow artifacts, and a
# `v*` tag also attaches them to a GitHub release.
name: desktop
on:
  push:
    branches: [fork/dev]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - run: npm ci
      # The Element Call widget only changes with element-call/, so reuse its build
      # (restored after npm ci, which wipes node_modules).
      - name: Restore the Element Call widget build
        id: widget
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/pinniped-element-call
          key: element-call-${{ hashFiles('element-call/**', 'scripts/fork/element-call/build.mjs') }}
      - name: Build (includes the Element Call fork)
        env:
          APP_COMMIT: ${{ github.sha }}
          NODE_OPTIONS: --max_old_space_size=8192
          # File mtimes after a checkout are always newer than the cached build, so
          # tell vite to trust a cache hit instead of rebuilding the widget.
          ELEMENT_CALL_FORK_REBUILD: ${{ steps.widget.outputs.cache-hit == 'true' && '0' || '1' }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  package:
    name: Package (${{ matrix.name }})
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            # The RPM is packaged with nfpm below, not electron-builder (see electron/linux/nfpm.yaml).
            flags: --linux AppImage flatpak
            files: |
              electron/out/*.AppImage
              electron/out/*.rpm
              electron/out/*.flatpak
          - name: windows
            os: windows-latest
            flags: --win msi
            files: electron/out/*.msi
          - name: macos
            os: macos-latest
            flags: --mac dmg --x64 --arm64
            files: electron/out/*.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install rpm tooling
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm flatpak flatpak-builder
          # The helper links libpipewire; bindgen needs libclang to read its headers.
          sudo apt-get install -y libpipewire-0.3-dev libclang-dev
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - run: npm ci
        env:
          HUSKY: '0'
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.name == 'linux'
      # The helper (portals, screen share audio) ships inside the Linux builds (electron-builder
      # extraResources and nfpm).
      - name: Build the desktop helper
        if: matrix.name == 'linux'
        run: cargo build --release --manifest-path electron/helper/Cargo.toml
      - name: Package
        run: npx electron-builder --config electron/electron-builder.yml ${{ matrix.flags }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/setup-go@v5
        if: matrix.name == 'linux'
        with:
          go-version: stable
      # Pinned to the version the justfile recipe was tested with.
      - name: Build the RPM with nfpm
        if: matrix.name == 'linux'
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          export VERSION="$(node -p "require('./package.json').version")"
          chmod -R go-w electron/out/linux-unpacked
          nfpm package --packager rpm --config electron/linux/nfpm.yaml --target "electron/out/Pinniped-${VERSION}-x86_64.rpm"
          rpm -qpi "electron/out/Pinniped-${VERSION}-x86_64.rpm"
      - uses: actions/upload-artifact@v4
        with:
          name: pinniped-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pinniped-*
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes
