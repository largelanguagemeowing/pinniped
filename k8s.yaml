# Pods in this namespace must meet the "restricted" Pod Security Standard, so no
# workload here can run privileged, use host namespaces or hostPath, or run as root.
apiVersion: v1
kind: Namespace
metadata:
  name: githubshit
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinny
  namespace: githubshit
  labels:
    app: cinny
spec:
  # Two pods, replaced one at a time: a rollout or a node drain always leaves one serving.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cinny
  template:
    metadata:
      labels:
        app: cinny
    spec:
      # Static site: no Kubernetes API access and no service env vars needed.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cinny
          # Pinned by digest, so every pod runs the same build; deploys rewrite it (AGENTS.md).
          image: repo.k8s.mreow.de/githubshit/cinny@sha256:e8b8e782e30c7cc990efe85d08a1f4cbd335f1f0a9eb8436e6e3533aa8aa6a61
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          # justserve opens its port only once the whole site is loaded, so an open port is ready.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          lifecycle:
            # A terminating pod keeps serving while the gateway stops routing to it.
            preStop:
              sleep:
                seconds: 5
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cinny
  namespace: githubshit
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: cinny
---
# cinny.k8s.mreow.de and im.queef.in are routed by HTTPRoutes in the cluster's
# infrastructure repo. pinniped.stablecat.club is routed from here (below); only its
# HTTPS listener (named pinniped-stablecat-club, TLS from the secret below) lives on the
# shared gateway in that repo. All of them target this Service on port 80.
apiVersion: v1
kind: Service
metadata:
  name: cinny
  namespace: githubshit
spec:
  type: ClusterIP
  selector:
    app: cinny
  ports:
    - port: 80
      targetPort: http
      name: http
---
# Only Envoy Gateway's proxies reach the pods, and only on the web port. justserve opens no
# connections, so no egress is allowed; Cilium tracks connections, so replies still go out.
# Kubelet probes come from the node, which Cilium admits.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cinny
  namespace: githubshit
spec:
  podSelector:
    matchLabels:
      app: cinny
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - port: http
---
# TLS for pinniped.stablecat.club, issued over HTTP-01 through the gateway, so the DNS
# record (A 185.255.121.170, AAAA 2a13:5681:1:c47::100) must exist first. The gateway
# listener reads the secret from this namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pinniped-stablecat-club-gw-tls
  namespace: githubshit
spec:
  secretName: pinniped-stablecat-club-gw-tls
  dnsNames:
    - pinniped.stablecat.club
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod-gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pinniped-stablecat-club
  namespace: githubshit
spec:
  parentRefs:
    - name: edge
      namespace: envoy-gateway-system
      sectionName: pinniped-stablecat-club
  hostnames:
    - pinniped.stablecat.club
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: cinny
          port: 80
---
# Plain HTTP to HTTPS. The shared redirect routes in the infrastructure repo are at the
# 16-hostname limit, and the gateway's http listener accepts routes from any namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pinniped-stablecat-club-https-redirect
  namespace: githubshit
spec:
  parentRefs:
    - name: edge
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - pinniped.stablecat.club
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
